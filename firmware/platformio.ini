[env:beacon]
; pioarduino is the only platform shipping Arduino-ESP32 core 3.3.x (tech.md §5).
; 55.03.35 == Arduino v3.3.5 / ESP-IDF v5.5.1. Verified at boot (main.cpp logs the core version).
; PIN RATIONALE: core 3.3.6+ changed spiFrequencyToClockDiv() to a 2-arg signature, which
; GFX_Library_for_Arduino 1.6.4/1.6.5 do not yet handle (their SPI databus files fail to compile).
; 3.3.5 is the LAST 3.3.x with the 1-arg signature => newest core that keeps the tech.md §5
; GFX 1.6.4 pin compiling clean. Do not bump past 55.03.35 until GFX gains 2-arg support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; OPI PSRAM
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *   ; [env:beacon] runs no host unit tests; on-device checks use `pio run -t upload`
extra_scripts = pre:version.py   ; injects -DFIRMWARE_VERSION (git tag in CI, else "dev")

build_flags =
  -DBOARD_HAS_PSRAM
  -DBEACON_LVGL_PSRAM      ; P2: BLE stack + WiFi + TLS need the internal SRAM; keep LVGL draw buffers in PSRAM (heap re-measure: min int_free ~44KB without this => TLS fetches time out). tech.md §8.
  -DBEACON_DEV=0            ; 0 = real device-direct data layer (P1); set 1 for the dev seeder + state-driver harness
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE   ; generated font C files then use #include "lvgl.h" (resolves via lib)
  ; Panel blit path (measured on hardware via env:perf; docs/perf.md §2). These two MUST move
  ; together with ui/lvgl_port.cpp's DISPLAY_BLIT selector:
  ;   LV_COLOR_16_SWAP=1 makes LVGL rasterise big-endian RGB565, which lets the flush use
  ;   draw16bitBeRGBBitmap -- a straight buffer-pointer handoff to SPI. The default
  ;   draw16bitRGBBitmap instead byte-swaps EVERY pixel out of the PSRAM draw buffer into a 2KB
  ;   staging buffer first, which measured ~60% of blit time (blit 59 -> 40 ms/frame when removed).
  ;   ESP32QSPI_FREQUENCY: the GFX library defaults to 40 MHz; the panel runs clean at 80 (verified
  ;   on glass, colours + no tearing) and it took blit 40 -> 29.5 ms/frame.
  ; Net: blit -50%, full-screen frames ~7.5 -> ~9.6/s. Reverting either one alone is safe; reverting
  ; only LV_COLOR_16_SWAP without DISPLAY_BLIT (or vice versa) reverses every pixel's colour bytes.
  -DLV_COLOR_16_SWAP=1
  -DESP32QSPI_FREQUENCY=80000000
  -I src
  ; NOTE: do NOT add -DLV_CONF_PATH — LVGL 8.4 double-stringifies it and the include breaks.
  ; LV_CONF_INCLUDE_SIMPLE makes LVGL do #include "lv_conf.h", found via -I src.

lib_deps =
  lvgl/lvgl@8.4.0
  moononournation/GFX Library for Arduino@1.6.4
  lewisxhe/XPowersLib@0.2.6
  lewisxhe/SensorLib@0.3.3
  bblanchon/ArduinoJson@^7.2.0

[env:capture]
; Screenshot build: identical to env:beacon but with the flush-tap capture harness and the dev seeder
; (deterministic, always-populated screens). Flash this, then run tools/capture/grab.py to pull a
; glare-free PNG of every theme x screen straight from the panel framebuffer. NOT for production.
extends = env:beacon
build_unflags = -DBEACON_DEV=0      ; drop the inherited real-data flag before forcing the seeder on
build_flags =
  ${env:beacon.build_flags}
  -DBEACON_CAPTURE=1
  -DBEACON_DEV=1           ; populate screens with seeded data so the catalog isn't empty/LOADING

[env:perf]
; Render-profiling build: identical to env:beacon + the flush-timing profiler in ui/lvgl_port.cpp,
; which logs `perf: blit …` once per second over serial. Use it to measure the swipe frame budget
; (see docs/perf.md §5). Real data + real BLE, unlike env:capture -- only the profiler is added.
; It also drives a continuous auto-swipe (ui/carousel.cpp autoswipe_cb) so the render load is
; reproducible without a finger on the glass -- the device will cycle screens by itself, which is the
; benchmark, not a fault. NOT for daily use; flash env:beacon to get normal behaviour back.
; To A/B a build flag, append an override here (build_unflags first if it is set in env:beacon), e.g.
;   build_unflags = -DESP32QSPI_FREQUENCY=80000000
; The normal env:beacon build is byte-for-byte unaffected.
extends = env:beacon
build_flags =
  ${env:beacon.build_flags}
  -DBEACON_PERF=1

[env:audiospike]
; Heap-measurement spike: identical to env:beacon + BEACON_AUDIO_SPIKE flag.
; Enables audio_init(), periodic HEAPSPIKE logs (every 1 s), and a chime every 15 s.
; The normal [env:beacon] build is byte-for-byte unaffected (flag absent => audio.cpp excluded).
extends = env:beacon
build_flags =
  ${env:beacon.build_flags}
  -DBEACON_AUDIO_SPIKE=1

[env:capture_buddy]
; env:capture + BEACON_CAP_BUDDY=1 (ui/dev_seed.cpp): seeds a present Approve/Deny prompt (RAM only, not
; NVS) so the takeover card renders without a real Claude Code hook round-trip -- the negative half of
; plan §8 criterion 3's bench substitute (Agents page still present/enabled => Home must NOT take over;
; the Agents/CLAUDE screen shows the prompt normally either way).
extends = env:capture
build_flags =
  ${env:capture.build_flags}
  -DBEACON_CAP_BUDDY=1

[env:capture_takeover]
; env:capture_buddy + BEACON_FORCE_NO_AGENTS=1 (ui/carousel.cpp load_active_pages()): additionally drops
; "agents" from the in-RAM active page list this boot builds screens from -- NVS is never written, so a
; normal `-e beacon`/`-e capture` boot afterward sees the real hub-configured page list again. Meets
; Home's takeover precondition (`!carousel_has_page("agents")`) without a human dragging the Agents page
; out of the hub's Settings window. Positive half of plan §8 criterion 3's bench substitute.
extends = env:capture_buddy
build_flags =
  ${env:capture_buddy.build_flags}
  -DBEACON_FORCE_NO_AGENTS=1

[env:capture_takeover_q]
; Same RAM-only "agents" removal as env:capture_takeover, but BEACON_CAP_BUDDY=2 (question state,
; ui/dev_seed.cpp) instead of 1 (permission prompt). Proves the OTHER half of plan §8 criterion 3's
; negative check: a `question`-state session must NOT take Home over even with Agents hidden, because no
; hook is held for AskUserQuestion (CONTRACT.md §C.3) -- there is no stall to fix, so a takeover here
; would be pure noise.
extends = env:capture_takeover
build_unflags = -DBEACON_CAP_BUDDY=1
build_flags =
  ${env:capture.build_flags}
  -DBEACON_CAP_BUDDY=2
  -DBEACON_FORCE_NO_AGENTS=1

[env:restore_default_comps]
; One-shot bench cleanup (WS-4, not shipped): identical to env:beacon but resets NVS "c_home" to the
; compiled default on boot (ui/carousel.cpp carousel_init()), undoing env:compstress's real (by design)
; NVS writes from the live-rebuild stress run. Flash once, confirm Home shows the default assignment,
; then flash back to plain env:beacon.
extends = env:beacon
build_flags =
  ${env:beacon.build_flags}
  -DBEACON_RESTORE_DEFAULT_COMPS=1

[env:compstress]
; On-hardware automated substitute for the manual half of the plan §8 exit gate (WS-4,
; docs/plans/2026-07-27-home-complications-plan.md §8/§10): repeatedly applies a live Home complication
; change (the SAME carousel_apply_comps() a real hub push calls) while BEACON_PERF's autoswipe scrolls
; the carousel continuously -- deliberately trying to land an apply mid-scroll-animation and inside the
; s_settling recenter window, without a finger on the glass or a hub connection. BEACON_DEV=1 seeds every
; screen so there's real content to redraw. Watch serial for `compstress:`/`hub: comps rev=...` lines, a
; crash/Guru Meditation/LVGL assert (none expected), and the periodic `hub: conn=... min=...` heap line
; (should not drop more than ~1KB across the run). NOT for daily use; flash env:beacon afterward.
extends = env:beacon
build_unflags = -DBEACON_DEV=0
build_flags =
  ${env:beacon.build_flags}
  -DBEACON_DEV=1
  -DBEACON_PERF=1
  -DBEACON_COMPS_STRESS=1

[env:native]
; Host-only env for pure-logic unit tests (records / screen_state / datastore /
; config validation / theme catalog). NO Arduino, NO LVGL — kept out of native
; translation units via -DBEACON_NATIVE. Does not affect [env:beacon] above.
platform = native
test_framework = unity
test_build_src = yes   ; compile project src/ (filtered below) into test binaries, not just test/ files
lib_deps =
  bblanchon/ArduinoJson@^7.2.0   ; header-only; the pure parse TUs deserialize on the host too
; runs every test/test_<unit>/ folder (each is its own program with its own main()).
build_flags =
  -DBEACON_NATIVE=1        ; guards Arduino/LVGL-coupled code out of host builds
  -DUNITY_INCLUDE_DOUBLE   ; finance/change-basis asserts compare doubles
  -I src
  ; do NOT add -std=gnu++17 here: build_flags also hit Unity's C sources and clang
  ; rejects a C++ standard on .c files. Apple clang defaults to C++17 for .cpp (std::mutex OK).
; Arduino/LVGL-free TUs the host tests link: datastore + the pure parse/tz/change-basis logic.
build_src_filter = -<*> +<core/datastore.cpp> +<core/tz_map.cpp> +<core/change_basis.cpp>
  +<core/wifi_list.cpp> +<core/hub_proto.cpp> +<core/hub_report.cpp> +<fetch/parse_weather.cpp> +<fetch/parse_finance.cpp> +<fetch/parse_geoip.cpp> +<fetch/parse_ice.cpp> +<fetch/parse_series.cpp> +<core/idle.cpp> +<core/imu_detect.cpp> +<core/about_format.cpp> +<config/ticker_table.cpp> +<config/ticker_store.cpp> +<core/timekeep_cal.cpp> +<core/page_config.cpp> +<core/complications.cpp> +<core/comp_state.cpp> +<core/sonos_art.cpp>
  ; core/sonos_art.cpp (WS-2, plan §4): Layer 1 pure decision functions + the native-visible tile-buffer
  ; accessors (plain malloc, #if BEACON_NATIVE). net_lan.cpp is Arduino-coupled (WiFiClient) and is
  ; DELIBERATELY NOT added here -- every decision worth testing lives in sonos_art.cpp instead, so
  ; net_lan.cpp stays a thin socket loop with nothing to unit-test (plan §4 WS-2 "Files to touch").
